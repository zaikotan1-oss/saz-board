<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コース指定</title>
<style>
  body { margin:0; background:#1b1d22; color:#eee; font-family:"Yu Gothic UI","Meiryo",sans-serif; }
  header { padding:10px 14px; background:#262930; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  select, button { font-size:15px; padding:6px 10px; border-radius:6px; border:1px solid #444; background:#30343d; color:#eee; }
  #msg { font-size:18px; font-weight:bold; color:#f2b705; }
  #out { font-size:16px; padding:8px 14px; user-select:all; background:#111; margin:10px 14px; border-radius:6px; white-space:pre; }
  #wrap { position:relative; display:inline-block; margin:0 14px; }
  canvas { max-width:calc(100vw - 28px); height:auto; cursor:crosshair; display:block; }
</style>
</head>
<body>
<header>
  <select id="map"></select>
  <span id="msg">① スタート地点をクリック</span>
  <button id="reset">やり直し</button>
  <button id="copy">結果をコピー</button>
</header>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="out">（2点クリックするとここに出ます）</div>
<script>
(async () => {
  const DB = await (await fetch('maps/maps.json')).json();
  const sel = document.getElementById('map'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const msg = document.getElementById('msg'), out = document.getElementById('out');
  let img = null, pts = [];
  for (const m of DB.maps) if (m.image) { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; sel.appendChild(o); }
  async function load() {
    const m = DB.maps.find(x => x.id === sel.value);
    img = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = m.image; });
    cv.width = img.width; cv.height = img.height; pts = []; draw();
  }
  function draw() {
    ctx.drawImage(img, 0, 0);
    if (pts.length === 2) { ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.stroke(); }
    pts.forEach((p, i) => { ctx.fillStyle = i ? '#ff5050' : '#00c8ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.font = 'bold 20px "Yu Gothic UI",Meiryo'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(i ? 'GOAL' : 'START', p[0] + 16, p[1] - 10); ctx.fillStyle = i ? '#ff5050' : '#00c8ff'; ctx.fillText(i ? 'GOAL' : 'START', p[0] + 16, p[1] - 10); });
    msg.textContent = pts.length === 0 ? '① スタート地点をクリック' : pts.length === 1 ? '② ゴール（段差）をクリック' : '③ 「結果をコピー」を押して、チャットに貼ってください';
    out.textContent = pts.length === 2 ? JSON.stringify({ map: sel.value, start: pts[0], goal: pts[1] }) : '（2点クリックするとここに出ます）';
  }
  cv.addEventListener('click', e => {
    if (pts.length >= 2) return;
    const r = cv.getBoundingClientRect();
    pts.push([Math.round((e.clientX - r.left) * cv.width / r.width), Math.round((e.clientY - r.top) * cv.height / r.height)]); draw();
  });
  document.getElementById('reset').onclick = () => { pts = []; draw(); };
  document.getElementById('copy').onclick = async () => { try { await navigator.clipboard.writeText(out.textContent); msg.textContent = 'コピーしました。チャットに貼ってください'; } catch (e) { msg.textContent = '下の文字を選んでコピーしてください'; } };
  sel.onchange = load; await load();
})();
</script>
</body>
</html>
